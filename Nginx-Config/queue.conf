# Nginx-Config/queue.conf
# This file should be symlinked or copied to your Nginx conf.d directory
# It enables high-concurrency WebSocket and SSE (Server-Sent Events) proxying

upstream backend_cluster {
    # Replace with actual backend IPs for load balancing
    server localhost:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name queue.hospital.local;

    # 1. API proxy with SSE and WebSocket support
    location /api/ {
        proxy_pass http://backend_cluster/;
        
        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket & SSE specific configurations
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Prevent Nginx from buffering SSE streams (CRITICAL for real-time push)
        proxy_buffering off;
        proxy_cache off;
        
        # Extended timeouts for long-polling / persistent connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
