# 关键配置（与 application.yml 对齐）。部分环境下仅 yml 未绑定时，本文件可保证 datasource/port 生效。
# 本地覆盖仍可用环境变量 DATASOURCE_URL / DB_USERNAME / DB_PASSWORD / SERVER_PORT，或 application-local.yml
spring.application.name=pdjh-server
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/api
spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/pdjh?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false
